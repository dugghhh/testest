<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 Shooting Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1117;
    --surface: #161b24;
    --surface2: #1e2533;
    --surface3: #262e3e;
    --border: #2d3548;
    --border2: #3d4a60;
    --accent: #c8a96e;
    --accent2: #e2c48a;
    --accent-dim: rgba(200,169,110,0.15);
    --accent-dim2: rgba(200,169,110,0.08);
    --text: #e8e2d9;
    --text2: #a09880;
    --text3: #6a6050;
    --danger: #e05555;
    --danger-dim: rgba(224,85,85,0.12);
    --success: #5ba05b;
    --success-dim: rgba(91,160,91,0.12);
    --info: #4a90d9;
    --info-dim: rgba(74,144,217,0.12);
    --radius: 6px;
    --radius2: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
    --trans: 0.18s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  /* ---- HEADER ---- */
  #app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 58px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  #app-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--accent);
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .header-spacer { flex: 1; }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  /* ---- FILTERS BAR ---- */
  #filters-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  #filters-bar label { font-size: 12px; color: var(--text2); margin-right: 2px; }
  #filters-bar select, #filters-bar input[type="text"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
    height: 32px;
    outline: none;
    transition: border-color var(--trans);
  }
  #filters-bar select:focus, #filters-bar input:focus { border-color: var(--accent); }
  #filters-bar .filter-group { display: flex; align-items: center; gap: 6px; }
  #clear-filters {
    font-size: 12px;
    color: var(--text3);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0 6px;
    transition: color var(--trans);
    font-family: inherit;
  }
  #clear-filters:hover { color: var(--accent); }

  /* ---- MAIN LAYOUT ---- */
  #main {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 0;
    min-height: calc(100vh - 110px);
  }

  /* ---- SIDEBAR ---- */
  #sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    position: sticky;
    top: 110px;
    height: calc(100vh - 110px);
    overflow-y: auto;
  }
  #sidebar h2 {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text3);
    padding: 0 18px 10px;
  }
  .month-nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 0;
    transition: background var(--trans);
    font-size: 13px;
    color: var(--text2);
    border-left: 2px solid transparent;
  }
  .month-nav-item:hover { background: var(--surface2); color: var(--text); }
  .month-nav-item.active {
    border-left-color: var(--accent);
    background: var(--accent-dim2);
    color: var(--accent);
    font-weight: 600;
  }
  .month-event-badge {
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 10px;
    font-weight: 600;
  }
  #sidebar-stats {
    padding: 16px 18px;
    border-top: 1px solid var(--border);
    margin-top: 12px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text3);
    padding: 3px 0;
  }
  .stat-row strong { color: var(--text2); }

  /* ---- CALENDAR AREA ---- */
  #calendar-area {
    padding: 24px;
    overflow-y: auto;
  }

  .month-section {
    margin-bottom: 32px;
    scroll-margin-top: 120px;
  }
  .month-header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .month-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--accent);
  }
  .month-header .month-year {
    font-size: 13px;
    color: var(--text3);
  }
  .month-header .month-event-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--text3);
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .day-name {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text3);
    padding: 6px 0;
    font-weight: 600;
  }
  .day-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 80px;
    padding: 6px;
    cursor: pointer;
    transition: border-color var(--trans), background var(--trans);
    position: relative;
    overflow: hidden;
  }
  .day-cell:hover { border-color: var(--accent); background: var(--surface2); }
  .day-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .day-cell.today {
    border-color: var(--accent);
    background: var(--accent-dim2);
  }
  .day-cell.has-events {
    background: var(--surface2);
  }
  .day-number {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    line-height: 1;
  }
  .day-cell.today .day-number {
    color: var(--accent);
  }
  .day-cell.weekend .day-number { color: var(--text3); }
  .day-events { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
  .event-pill {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
    font-weight: 600;
    transition: opacity var(--trans);
  }
  .event-pill:hover { opacity: 0.85; }
  .more-events {
    font-size: 10px;
    color: var(--text3);
    padding: 1px 4px;
    cursor: pointer;
  }
  .more-events:hover { color: var(--accent); }

  /* ---- DISCIPLINE COLORS ---- */
  .disc-sporting    { background: #2a4a2a; color: #7dc97d; }
  .disc-skeet       { background: #2a2a4a; color: #7d7dcd; }
  .disc-trap        { background: #4a2a2a; color: #cd7d7d; }
  .disc-compak      { background: #4a3a1a; color: #cdaa5a; }
  .disc-sport-trap  { background: #1a3a4a; color: #5aaad0; }
  .disc-all-round   { background: #3a1a4a; color: #b07dcd; }
  .disc-fitasc      { background: #2a3a1a; color: #9dcc5a; }
  .disc-other       { background: #2a2a2a; color: #9d9d9d; }

  /* ---- BUTTONS ---- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all var(--trans);
    white-space: nowrap;
    font-weight: 600;
    line-height: 1;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim2); }
  .btn-primary {
    background: var(--accent);
    color: #0e0e0e;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); color: #0e0e0e; }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger-dim); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-icon { padding: 7px 9px; }

  /* ---- MODAL ---- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius2);
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
    animation: slideUp 0.18s ease;
  }
  @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--accent);
  }
  .modal-body { padding: 20px; }
  .modal-footer {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  /* ---- FORM ---- */
  .form-group { margin-bottom: 16px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label.field-label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .field-label .req { color: var(--danger); margin-left: 2px; }
  input[type="text"], input[type="date"], input[type="number"],
  select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color var(--trans);
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 72px; }
  select option { background: var(--surface2); }
  .error-msg { font-size: 12px; color: var(--danger); margin-top: 4px; }
  .form-error-banner {
    background: var(--danger-dim);
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 13px;
    color: var(--danger);
    margin-bottom: 14px;
  }

  /* ---- CHECKLIST ---- */
  .checklist-section {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .checklist-section h4 {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 12px;
    font-weight: 600;
  }
  .checklist-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .checklist-item {
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text2);
    padding: 4px 0;
    transition: color var(--trans);
  }
  .checklist-item:hover { color: var(--text); }
  .checklist-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    min-width: 16px;
    accent-color: var(--accent);
    cursor: pointer;
    background: var(--surface2);
    border: 1px solid var(--border2);
    padding: 0;
  }
  .checklist-item.checked span { text-decoration: line-through; color: var(--text3); }
  .checklist-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .progress-bar {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .progress-label { font-size: 11px; color: var(--text3); white-space: nowrap; }

  /* ---- EVENT DETAIL VIEW ---- */
  .event-detail-header {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .event-disc-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
  }
  .event-detail-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .meta-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
  }
  .meta-card .meta-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 3px;
    font-weight: 600;
  }
  .meta-card .meta-value {
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
  }
  .notes-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 16px;
    white-space: pre-wrap;
    min-height: 40px;
  }

  /* ---- CONFIRM DIALOG ---- */
  .confirm-dialog {
    max-width: 380px;
    text-align: center;
  }
  .confirm-dialog .modal-body p {
    color: var(--text2);
    font-size: 14px;
    line-height: 1.6;
  }
  .confirm-dialog .modal-footer { justify-content: center; }

  /* ---- TOAST ---- */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 500;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text);
    box-shadow: var(--shadow);
    animation: toastIn 0.2s ease forwards;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

  /* ---- EMPTY STATE ---- */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text3);
  }
  .empty-state .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* ---- SCROLLBAR ---- */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ---- RESPONSIVE ---- */
  @media (max-width: 768px) {
    #main { grid-template-columns: 1fr; }
    #sidebar {
      position: static;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }
    .month-nav-list { display: flex; overflow-x: auto; gap: 4px; padding: 0 12px; }
    .month-nav-item { white-space: nowrap; border-radius: var(--radius); border-left: none; padding: 6px 12px; }
    .month-nav-item.active { border: 1px solid var(--accent); }
    #sidebar h2, #sidebar-stats { display: none; }
    #filters-bar { padding: 8px 12px; gap: 8px; }
    #app-header { padding: 0 14px; }
    #calendar-area { padding: 14px; }
    .form-row { grid-template-columns: 1fr; }
    .event-detail-meta { grid-template-columns: 1fr; }
    .checklist-grid { grid-template-columns: 1fr; }
    .modal { max-width: 100%; }
  }

  @media (max-width: 480px) {
    .day-cell { min-height: 60px; padding: 4px; }
    .day-number { font-size: 11px; }
    .event-pill { font-size: 9px; padding: 1px 4px; }
    .calendar-grid { gap: 2px; }
  }

  /* ---- LEGEND ---- */
  #disc-legend {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text3);
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
  }

  .section-divider {
    height: 1px;
    background: var(--border);
    margin: 8px 0 14px;
  }
</style>
</head>
<body>

<header id="app-header">
  <h1>⊕ 2027 Shooting Calendar</h1>
  <div class="header-spacer"></div>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="openAddModal()">+ Add Event</button>
  </div>
</header>

<div id="filters-bar">
  <div class="filter-group">
    <label>Month</label>
    <select id="filter-month" onchange="applyFilters()">
      <option value="">All months</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Discipline</label>
    <select id="filter-discipline" onchange="applyFilters()">
      <option value="">All disciplines</option>
      <option value="Sporting">Sporting</option>
      <option value="Skeet">Skeet</option>
      <option value="Trap">Trap</option>
      <option value="Compak">Compak</option>
      <option value="Sport Trap">Sport Trap</option>
      <option value="All Round">All Round</option>
      <option value="FITASC">FITASC</option>
      <option value="Other">Other</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Location</label>
    <input type="text" id="filter-location" placeholder="Search location..." oninput="applyFilters()" style="width:160px">
  </div>
  <div class="filter-group">
    <label>Checklist</label>
    <select id="filter-checklist" onchange="applyFilters()">
      <option value="">Any status</option>
      <option value="complete">Fully complete</option>
      <option value="incomplete">Incomplete</option>
    </select>
  </div>
  <button id="clear-filters" onclick="clearFilters()">✕ Clear filters</button>
</div>

<div id="disc-legend">
  <span class="legend-item"><span class="legend-dot" style="background:#5a8a5a"></span>Sporting</span>
  <span class="legend-item"><span class="legend-dot" style="background:#5a5a9a"></span>Skeet</span>
  <span class="legend-item"><span class="legend-dot" style="background:#9a5a5a"></span>Trap</span>
  <span class="legend-item"><span class="legend-dot" style="background:#9a7a3a"></span>Compak</span>
  <span class="legend-item"><span class="legend-dot" style="background:#3a7a9a"></span>Sport Trap</span>
  <span class="legend-item"><span class="legend-dot" style="background:#7a3a9a"></span>All Round</span>
  <span class="legend-item"><span class="legend-dot" style="background:#6a8a3a"></span>FITASC</span>
  <span class="legend-item"><span class="legend-dot" style="background:#5a5a5a"></span>Other</span>
</div>

<div id="main">
  <nav id="sidebar">
    <h2>Navigate</h2>
    <div class="month-nav-list" id="month-nav-list"></div>
    <div id="sidebar-stats">
      <div class="stat-row"><span>Total events</span><strong id="stat-total">0</strong></div>
      <div class="stat-row"><span>Upcoming</span><strong id="stat-upcoming">0</strong></div>
      <div class="stat-row"><span>Days covered</span><strong id="stat-days">0</strong></div>
    </div>
  </nav>
  <main id="calendar-area" onscroll="updateActiveSidebarItem()"></main>
</div>

<!-- Modal container -->
<div id="modal-container"></div>
<div id="toast-container"></div>

<script>
// ========== DATA ==========
const MONTHS = [
  'January','February','March','April','May','June',
  'July','August','September','October','November','December'
];
const MONTH_DAYS = [31,28,31,30,31,30,31,31,30,31,30,31]; // 2027 - NOT a leap year
const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// First weekday of each month in 2027 (0=Mon, 6=Sun)
// Jan=4(Fri), Feb=0(Mon), Mar=0(Mon), Apr=3(Thu), May=5(Sat), Jun=1(Tue)
// Jul=3(Thu), Aug=6(Sun), Sep=2(Wed), Oct=4(Fri), Nov=0(Mon), Dec=2(Wed)
const MONTH_FIRST_WEEKDAY = [4,0,0,3,5,1,3,6,2,4,0,2];

const DISCIPLINES = ['Sporting','Skeet','Trap','Compak','Sport Trap','All Round','FITASC','Other'];
const DISC_CLASS = {
  'Sporting':'disc-sporting','Skeet':'disc-skeet','Trap':'disc-trap',
  'Compak':'disc-compak','Sport Trap':'disc-sport-trap','All Round':'disc-all-round',
  'FITASC':'disc-fitasc','Other':'disc-other'
};
const CHECKLIST_ITEMS = [
  {key:'hotel', label:'Hotel booked'},
  {key:'travel', label:'Travel sorted'},
  {key:'entry', label:'Entry form completed'},
  {key:'payment', label:'Payment sent'},
  {key:'gun', label:'Gun / kit ready'},
  {key:'ammo', label:'Ammo sorted'},
  {key:'practice', label:'Practice booked'},
  {key:'notes', label:'Other notes completed'}
];

// ========== STATE ==========
let events = [];
let filters = { month:'', discipline:'', location:'', checklist:'' };
let activeModal = null;

// ========== STORAGE ==========
function saveEvents() {
  try { localStorage.setItem('shooting_cal_2027', JSON.stringify(events)); } catch(e) {}
}
function loadEvents() {
  try {
    const d = localStorage.getItem('shooting_cal_2027');
    if (d) events = JSON.parse(d);
  } catch(e) { events = []; }
}

// ========== DATE UTILS ==========
function dateToYMD(dateStr) {
  // returns {y,m,d} from "2027-01-15"
  const [y,m,d] = dateStr.split('-').map(Number);
  return {y,m,d};
}
function ymdToDate(y,m,d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function dateObjToStr(date) {
  return ymdToDate(date.getFullYear(), date.getMonth()+1, date.getDate());
}
function addDays(dateStr, n) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + n);
  return dateObjToStr(dt);
}
function daysBetween(start, end) {
  const a = new Date(start), b = new Date(end);
  return Math.round((b-a)/(1000*60*60*24));
}
function formatDateDisplay(dateStr) {
  const {y,m,d} = dateToYMD(dateStr);
  return `${d} ${MONTHS[m-1]} ${y}`;
}
function getDayOfWeek(y, m, d) {
  // 0=Mon, 6=Sun
  const dt = new Date(y, m-1, d);
  return (dt.getDay() + 6) % 7;
}
function isWeekend(y,m,d) {
  const dow = getDayOfWeek(y,m,d);
  return dow >= 5;
}
function dateInRange(dateStr, startStr, endStr) {
  return dateStr >= startStr && dateStr <= endStr;
}
function clampTo2027(dateStr) {
  if (dateStr < '2027-01-01') return '2027-01-01';
  if (dateStr > '2027-12-31') return '2027-12-31';
  return dateStr;
}

// ========== EVENT UTILS ==========
function getEventEndDate(ev) {
  return addDays(ev.startDate, (ev.duration || 1) - 1);
}
function getEventDates(ev) {
  const dates = [];
  for (let i = 0; i < (ev.duration || 1); i++) {
    dates.push(addDays(ev.startDate, i));
  }
  return dates;
}
function eventsForDate(dateStr, evList) {
  return evList.filter(ev => {
    const end = getEventEndDate(ev);
    return dateStr >= ev.startDate && dateStr <= end;
  });
}
function checklistProgress(ev) {
  const total = CHECKLIST_ITEMS.length;
  const done = CHECKLIST_ITEMS.filter(item => ev.checklist && ev.checklist[item.key]).length;
  return {done, total, pct: Math.round((done/total)*100)};
}
function isChecklistComplete(ev) {
  return CHECKLIST_ITEMS.every(item => ev.checklist && ev.checklist[item.key]);
}
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2,6);
}

// ========== FILTERED EVENTS ==========
function getFilteredEvents() {
  return events.filter(ev => {
    if (filters.discipline && ev.discipline !== filters.discipline) return false;
    if (filters.location && !ev.location.toLowerCase().includes(filters.location.toLowerCase())) return false;
    if (filters.checklist === 'complete' && !isChecklistComplete(ev)) return false;
    if (filters.checklist === 'incomplete' && isChecklistComplete(ev)) return false;
    if (filters.month) {
      const m = parseInt(filters.month);
      const monthStart = ymdToDate(2027, m, 1);
      const monthEnd = ymdToDate(2027, m, MONTH_DAYS[m-1]);
      const evEnd = getEventEndDate(ev);
      if (ev.startDate > monthEnd || evEnd < monthStart) return false;
    }
    return true;
  });
}

// ========== RENDER CALENDAR ==========
function renderCalendar() {
  const area = document.getElementById('calendar-area');
  const filteredEvs = getFilteredEvents();
  const evSet = new Set(filteredEvs.map(e=>e.id));

  let html = '';
  const monthsToShow = filters.month ? [parseInt(filters.month)-1] : [...Array(12).keys()];

  for (const mi of monthsToShow) {
    const m = mi + 1;
    const days = MONTH_DAYS[mi];
    const firstWd = MONTH_FIRST_WEEKDAY[mi];
    const monthStart = ymdToDate(2027, m, 1);
    const monthEnd = ymdToDate(2027, m, days);
    const monthEvs = filteredEvs.filter(ev => {
      const end = getEventEndDate(ev);
      return ev.startDate <= monthEnd && end >= monthStart;
    });

    html += `<section class="month-section" id="month-${m}">`;
    html += `<div class="month-header">
      <h2>${MONTHS[mi]}</h2>
      <span class="month-year">2027</span>
      ${monthEvs.length > 0 ? `<span class="month-event-count">${monthEvs.length} event${monthEvs.length!==1?'s':''}</span>` : ''}
    </div>`;
    html += `<div class="calendar-grid">`;

    // Day names header
    for (const dn of DAY_NAMES) {
      html += `<div class="day-name">${dn}</div>`;
    }

    // Empty cells before first day
    for (let e = 0; e < firstWd; e++) {
      html += `<div class="day-cell empty"></div>`;
    }

    // Day cells
    for (let d = 1; d <= days; d++) {
      const dateStr = ymdToDate(2027, m, d);
      const dayEvs = eventsForDate(dateStr, filteredEvs);
      const weekend = isWeekend(2027, m, d);
      const hasEvs = dayEvs.length > 0;
      let cls = 'day-cell';
      if (weekend) cls += ' weekend';
      if (hasEvs) cls += ' has-events';

      html += `<div class="${cls}" onclick="handleDayClick(event,'${dateStr}')">`;
      html += `<div class="day-number">${d}</div>`;
      if (hasEvs) {
        html += `<div class="day-events">`;
        const show = dayEvs.slice(0, 2);
        for (const ev of show) {
          const disc = ev.discipline || 'Other';
          const cls2 = DISC_CLASS[disc] || 'disc-other';
          const isStart = ev.startDate === dateStr;
          const isEnd = getEventEndDate(ev) === dateStr;
          const indicator = ev.duration > 1 ? (isStart ? '▶ ' : isEnd ? '■ ' : '— ') : '';
          html += `<div class="event-pill ${cls2}" onclick="event.stopPropagation();openViewModal('${ev.id}')" title="${escHtml(ev.name)}">${indicator}${escHtml(ev.name)}</div>`;
        }
        if (dayEvs.length > 2) {
          html += `<div class="more-events" onclick="event.stopPropagation();handleDayClick(event,'${dateStr}')">+${dayEvs.length-2} more</div>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    }

    html += `</div></section>`;
  }

  if (html === '') {
    html = `<div class="empty-state"><div class="empty-icon">🎯</div><p>No events match your filters.<br>Try adjusting or clearing the filters above.</p></div>`;
  }

  area.innerHTML = html;
  renderSidebar();
  renderStats();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========== SIDEBAR ==========
function renderSidebar() {
  const nav = document.getElementById('month-nav-list');
  const filteredEvs = getFilteredEvents();
  let html = '';
  for (let mi = 0; mi < 12; mi++) {
    const m = mi + 1;
    const monthStart = ymdToDate(2027, m, 1);
    const monthEnd = ymdToDate(2027, m, MONTH_DAYS[mi]);
    const count = filteredEvs.filter(ev => {
      const end = getEventEndDate(ev);
      return ev.startDate <= monthEnd && end >= monthStart;
    }).length;
    html += `<div class="month-nav-item" id="nav-month-${m}" onclick="scrollToMonth(${m})">
      ${MONTHS[mi].substring(0,3)}
      ${count > 0 ? `<span class="month-event-badge">${count}</span>` : ''}
    </div>`;
  }
  nav.innerHTML = html;
}

function renderStats() {
  const total = events.length;
  const now = new Date();
  const todayStr = dateObjToStr(now);
  const upcoming = events.filter(ev => getEventEndDate(ev) >= todayStr).length;
  const daysSet = new Set();
  events.forEach(ev => getEventDates(ev).forEach(d => daysSet.add(d)));
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-upcoming').textContent = upcoming;
  document.getElementById('stat-days').textContent = daysSet.size;
}

function scrollToMonth(m) {
  const el = document.getElementById(`month-${m}`);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function updateActiveSidebarItem() {
  const area = document.getElementById('calendar-area');
  let active = 1;
  for (let m = 1; m <= 12; m++) {
    const el = document.getElementById(`month-${m}`);
    if (!el) continue;
    const rect = el.getBoundingClientRect();
    const areaRect = area.getBoundingClientRect();
    if (rect.top - areaRect.top < 60) active = m;
  }
  document.querySelectorAll('.month-nav-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.getElementById(`nav-month-${active}`);
  if (activeEl) activeEl.classList.add('active');
}

// ========== FILTERS ==========
function populateMonthFilter() {
  const sel = document.getElementById('filter-month');
  sel.innerHTML = '<option value="">All months</option>';
  MONTHS.forEach((mn, i) => {
    sel.innerHTML += `<option value="${i+1}">${mn}</option>`;
  });
}
function applyFilters() {
  filters.month = document.getElementById('filter-month').value;
  filters.discipline = document.getElementById('filter-discipline').value;
  filters.location = document.getElementById('filter-location').value;
  filters.checklist = document.getElementById('filter-checklist').value;
  renderCalendar();
}
function clearFilters() {
  filters = {month:'',discipline:'',location:'',checklist:''};
  document.getElementById('filter-month').value = '';
  document.getElementById('filter-discipline').value = '';
  document.getElementById('filter-location').value = '';
  document.getElementById('filter-checklist').value = '';
  renderCalendar();
}

// ========== DAY CLICK ==========
function handleDayClick(e, dateStr) {
  const dayEvs = eventsForDate(dateStr, getFilteredEvents());
  if (dayEvs.length === 0) {
    openAddModal(dateStr);
  } else if (dayEvs.length === 1) {
    openViewModal(dayEvs[0].id);
  } else {
    openDayModal(dateStr, dayEvs);
  }
}

// ========== MODAL SYSTEM ==========
function showModal(content) {
  const container = document.getElementById('modal-container');
  container.innerHTML = `<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">${content}</div>`;
  activeModal = container.querySelector('.modal');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  const container = document.getElementById('modal-container');
  container.innerHTML = '';
  activeModal = null;
  document.body.style.overflow = '';
}
function handleOverlayClick(e) {
  if (e.target.id === 'modal-overlay') closeModal();
}

// ========== ADD/EDIT MODAL ==========
function openAddModal(prefillDate) {
  const ev = {
    id: null,
    name: '',
    startDate: prefillDate || '2027-01-01',
    duration: 1,
    location: '',
    notes: '',
    discipline: 'Sporting',
    checklist: {}
  };
  renderEventForm(ev, false);
}
function openEditModal(id) {
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  renderEventForm(JSON.parse(JSON.stringify(ev)), true);
}
function renderEventForm(ev, isEdit) {
  const discOptions = DISCIPLINES.map(d =>
    `<option value="${d}" ${ev.discipline===d?'selected':''}>${d}</option>`
  ).join('');

  const checklistHtml = CHECKLIST_ITEMS.map(item => {
    const checked = ev.checklist && ev.checklist[item.key] ? 'checked' : '';
    return `<label class="checklist-item ${checked?'checked':''}">
      <input type="checkbox" name="cl_${item.key}" ${checked} onchange="updateChecklistLabel(this)">
      <span>${item.label}</span>
    </label>`;
  }).join('');

  const html = `<div class="modal">
    <div class="modal-header">
      <h3>${isEdit ? 'Edit Event' : 'Add Event'}</h3>
      <button class="btn btn-icon btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="form-error-banner" style="display:none" class="form-error-banner"></div>
      <div class="form-group">
        <label class="field-label">Event Name <span class="req">*</span></label>
        <input type="text" id="f-name" value="${escHtml(ev.name)}" placeholder="e.g. British Open Sporting" maxlength="80">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="field-label">Start Date <span class="req">*</span></label>
          <input type="date" id="f-startdate" value="${ev.startDate}" min="2027-01-01" max="2027-12-31">
        </div>
        <div class="form-group">
          <label class="field-label">Duration (days) <span class="req">*</span></label>
          <input type="number" id="f-duration" value="${ev.duration||1}" min="1" max="31">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="field-label">Discipline <span class="req">*</span></label>
          <select id="f-discipline">${discOptions}</select>
        </div>
        <div class="form-group">
          <label class="field-label">Location / Ground <span class="req">*</span></label>
          <input type="text" id="f-location" value="${escHtml(ev.location)}" placeholder="e.g. West London Shooting School">
        </div>
      </div>
      <div class="form-group">
        <label class="field-label">Notes</label>
        <textarea id="f-notes" placeholder="Entry details, contact info, class entered...">${escHtml(ev.notes||'')}</textarea>
      </div>
      <div class="checklist-section">
        <h4>Event Preparation Checklist</h4>
        <div class="checklist-grid">${checklistHtml}</div>
      </div>
    </div>
    <div class="modal-footer">
      ${isEdit ? `<button class="btn btn-danger btn-sm" onclick="confirmDelete('${ev.id}')">Delete</button>` : ''}
      <button class="btn btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveEventForm('${ev.id||''}', ${isEdit})">
        ${isEdit ? 'Save Changes' : 'Add Event'}
      </button>
    </div>
  </div>`;
  showModal(html);
}
function updateChecklistLabel(cb) {
  const lbl = cb.closest('.checklist-item');
  if (cb.checked) lbl.classList.add('checked');
  else lbl.classList.remove('checked');
}
function saveEventForm(id, isEdit) {
  const name = document.getElementById('f-name').value.trim();
  const startDate = document.getElementById('f-startdate').value;
  const duration = parseInt(document.getElementById('f-duration').value) || 0;
  const discipline = document.getElementById('f-discipline').value;
  const location = document.getElementById('f-location').value.trim();
  const notes = document.getElementById('f-notes').value.trim();

  // Validate
  const errors = [];
  if (!name) errors.push('Event name is required.');
  if (!startDate) errors.push('Start date is required.');
  if (!location) errors.push('Location / ground is required.');
  if (duration < 1) errors.push('Duration must be at least 1 day.');
  if (startDate < '2027-01-01' || startDate > '2027-12-31') errors.push('Start date must be within 2027.');

  // Check end date is within a sensible range (can overflow into 2028 slightly, but start must be 2027)
  if (startDate && duration >= 1) {
    const endDate = addDays(startDate, duration - 1);
    if (endDate > '2027-12-31') {
      errors.push(`Event runs past 31 Dec 2027 (ends ${formatDateDisplay(endDate)}). Reduce duration or adjust start date.`);
    }
  }

  if (errors.length > 0) {
    const banner = document.getElementById('form-error-banner');
    banner.textContent = errors.join(' ');
    banner.style.display = 'block';
    banner.scrollIntoView({behavior:'smooth', block:'nearest'});
    return;
  }

  // Build checklist
  const checklist = {};
  CHECKLIST_ITEMS.forEach(item => {
    const cb = document.querySelector(`input[name="cl_${item.key}"]`);
    if (cb) checklist[item.key] = cb.checked;
  });

  if (isEdit) {
    const idx = events.findIndex(e => e.id === id);
    if (idx >= 0) {
      events[idx] = {...events[idx], name, startDate, duration, discipline, location, notes, checklist};
    }
  } else {
    events.push({id: generateId(), name, startDate, duration, discipline, location, notes, checklist});
  }

  saveEvents();
  renderCalendar();
  closeModal();
  showToast(isEdit ? 'Event updated.' : 'Event added.', 'success');
}

// ========== VIEW MODAL ==========
function openViewModal(id) {
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  const disc = ev.discipline || 'Other';
  const discCls = DISC_CLASS[disc] || 'disc-other';
  const endDate = getEventEndDate(ev);
  const {done, total, pct} = checklistProgress(ev);
  const isMultiDay = ev.duration > 1;

  const checklistHtml = CHECKLIST_ITEMS.map(item => {
    const checked = ev.checklist && ev.checklist[item.key];
    return `<div class="checklist-item ${checked?'checked':''}">
      <input type="checkbox" ${checked?'checked':''} disabled>
      <span>${item.label}</span>
    </div>`;
  }).join('');

  const html = `<div class="modal">
    <div class="modal-header">
      <h3>${escHtml(ev.name)}</h3>
      <button class="btn btn-icon btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="event-detail-header">
        <span class="event-disc-badge event-pill ${discCls}" style="font-size:12px;padding:4px 12px;">${escHtml(disc)}</span>
        ${isMultiDay ? `<span style="font-size:12px;color:var(--text3);">${ev.duration}-day event</span>` : ''}
      </div>
      <div class="event-detail-meta">
        <div class="meta-card">
          <div class="meta-label">Start</div>
          <div class="meta-value">${formatDateDisplay(ev.startDate)}</div>
        </div>
        <div class="meta-card">
          <div class="meta-label">${isMultiDay?'End':'Date'}</div>
          <div class="meta-value">${formatDateDisplay(endDate)}</div>
        </div>
        <div class="meta-card">
          <div class="meta-label">Location</div>
          <div class="meta-value" style="font-size:13px">${escHtml(ev.location)}</div>
        </div>
        <div class="meta-card">
          <div class="meta-label">Duration</div>
          <div class="meta-value">${ev.duration} day${ev.duration!==1?'s':''}</div>
        </div>
      </div>
      ${ev.notes ? `<div class="meta-card" style="margin-bottom:16px"><div class="meta-label" style="margin-bottom:6px">Notes</div><div style="font-size:13px;color:var(--text2);white-space:pre-wrap">${escHtml(ev.notes)}</div></div>` : ''}
      <div class="checklist-section">
        <h4>Preparation Checklist</h4>
        <div class="checklist-grid">${checklistHtml}</div>
        <div class="checklist-progress">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="progress-label">${done}/${total} complete</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" onclick="confirmDelete('${ev.id}')">Delete</button>
      <button class="btn btn-sm" onclick="closeModal()">Close</button>
      <button class="btn btn-primary btn-sm" onclick="closeModal();openEditModal('${ev.id}')">Edit Event</button>
    </div>
  </div>`;
  showModal(html);
}

// ========== DAY EVENTS LIST MODAL ==========
function openDayModal(dateStr, dayEvs) {
  const evHtml = dayEvs.map(ev => {
    const disc = ev.discipline || 'Other';
    const discCls = DISC_CLASS[disc] || 'disc-other';
    const {pct} = checklistProgress(ev);
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="closeModal();openViewModal('${ev.id}')">
      <div style="flex:1">
        <div style="font-weight:600;font-size:14px;margin-bottom:3px">${escHtml(ev.name)}</div>
        <div style="font-size:12px;color:var(--text3)">${escHtml(ev.location)} · ${ev.duration} day${ev.duration!==1?'s':''}</div>
      </div>
      <span class="event-pill ${discCls}" style="font-size:11px">${escHtml(disc)}</span>
      <div style="text-align:right;font-size:12px;color:var(--text3)">${pct}%</div>
    </div>`;
  }).join('');

  const html = `<div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3>${formatDateDisplay(dateStr)}</h3>
      <button class="btn btn-icon btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:12px;color:var(--text3);margin-bottom:12px">${dayEvs.length} event${dayEvs.length!==1?'s':''} on this date — click to view</p>
      ${evHtml}
    </div>
    <div class="modal-footer">
      <button class="btn btn-sm" onclick="closeModal()">Close</button>
      <button class="btn btn-primary btn-sm" onclick="closeModal();openAddModal('${dateStr}')">+ Add Event Here</button>
    </div>
  </div>`;
  showModal(html);
}

// ========== DELETE ==========
function confirmDelete(id) {
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  const html = `<div class="modal confirm-dialog">
    <div class="modal-header">
      <h3>Delete Event</h3>
      <button class="btn btn-icon btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <p>Are you sure you want to delete <strong style="color:var(--text)">"${escHtml(ev.name)}"</strong>?<br>This cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger btn-sm" onclick="deleteEvent('${id}')">Yes, Delete</button>
    </div>
  </div>`;
  showModal(html);
}
function deleteEvent(id) {
  events = events.filter(e => e.id !== id);
  saveEvents();
  renderCalendar();
  closeModal();
  showToast('Event deleted.', 'success');
}

// ========== TOAST ==========
function showToast(msg, type) {
  const container = document.getElementById('toast-container');
  const id = 'toast-' + Date.now();
  const icons = {success:'✓', error:'✕', info:'ℹ'};
  const el = document.createElement('div');
  el.className = `toast ${type||''}`;
  el.id = id;
  el.innerHTML = `<span>${icons[type]||'ℹ'}</span> ${escHtml(msg)}`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastOut 0.3s ease forwards';
    setTimeout(() => el.remove(), 300);
  }, 2800);
}

// ========== KEYBOARD ==========
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && activeModal) closeModal();
});

// ========== INIT ==========
function init() {
  loadEvents();
  populateMonthFilter();
  renderCalendar();
  // Activate first month in sidebar
  const firstNav = document.getElementById('nav-month-1');
  if (firstNav) firstNav.classList.add('active');
}

init();
</script>
